# Pushing to main ships both Cloudflare Pages projects. Neither is Git-connected on Cloudflare's side;
# this is what turns a merge into a deployment. Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit),
# CLOUDFLARE_ACCOUNT_ID. Repo variables baked into the client bundle: NEXT_PUBLIC_CARTO_KEY (street
# tiles) and NEXT_PUBLIC_DATA_URL (the R2 mirror) are optional. NEXT_PUBLIC_TURNSTILE_SITEKEY is NOT:
# Convex has TURNSTILE_SECRET set, so a build without the site key posts no token and every report comes
# back 429. That shipped unnoticed for weeks; the step below fails the build rather than let it repeat.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  app:
    name: app.kilohi.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          # Production Convex. .env.local points at the dev deployment and is not checked in.
          NEXT_PUBLIC_CONVEX_SITE_URL: https://standing-ram-435.convex.site
          NEXT_PUBLIC_CONVEX_URL: https://standing-ram-435.convex.cloud
          NEXT_PUBLIC_CARTO_KEY: ${{ vars.NEXT_PUBLIC_CARTO_KEY }}
          NEXT_PUBLIC_DATA_URL: ${{ vars.NEXT_PUBLIC_DATA_URL }}
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
      # A base URL that resolves empty sends every poll to the app's own origin, where there is no
      # /v1: the page still renders, it just never loads data. That shipped once (an unset repo
      # variable arrives as ""), so read the real value back rather than trusting the env.
      - name: The app knows where its data lives
        run: node --input-type=module -e 'const {DATA_URL,API_URL}=await import("./lib/data.ts");for(const [n,v] of [["DATA_URL",DATA_URL],["API_URL",API_URL]])if(!/^https:\/\/./.test(v)){console.error(`::error::${n} built as ${JSON.stringify(v)} — every fetch would hit the app origin and 404.`);process.exit(1)}console.log("data hosts ok:",DATA_URL,API_URL)'
        env:
          NEXT_PUBLIC_CONVEX_SITE_URL: https://standing-ram-435.convex.site
          NEXT_PUBLIC_DATA_URL: ${{ vars.NEXT_PUBLIC_DATA_URL }}
      # includes("") is always true, so prove the variable is non-empty BEFORE looking for it in the
      # bundle — a naive port of this check green-lights exactly the build it exists to catch.
      - name: The report form can prove you are a person
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            import { join } from "node:path";
            const key = process.env.NEXT_PUBLIC_TURNSTILE_SITEKEY ?? "";
            if (!key) { console.error("::error::NEXT_PUBLIC_TURNSTILE_SITEKEY is unset — the report form would ship with no widget and every post would come back 429."); process.exit(1); }
            const dir = "out/_next/static/chunks";
            const js = readdirSync(dir, { recursive: true }).filter((f) => String(f).endsWith(".js"))
              .map((f) => readFileSync(join(dir, String(f)), "utf8")).join("");
            if (!js.includes(key)) { console.error("::error::the Turnstile site key is not in the built bundle."); process.exit(1); }
            console.log("turnstile widget ships");'
        env:
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
      - run: npx wrangler pages deploy out --project-name kilo --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  site:
    name: kilohi.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx wrangler pages deploy site --project-name kilohi --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
