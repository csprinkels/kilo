<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kilo — App Store screenshots</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body { width: 1320px; height: 2868px; background: var(--paper); color: var(--ink); font-family: Nunito, sans-serif; }
.canvas { position: relative; width: 100%; height: 100%; overflow: hidden; }
.contours { position: absolute; width: 1900px; height: 2400px; left: 200px; top: 620px; color: var(--accent); opacity: .17; transform: rotate(-22deg); }
.wash { position: absolute; width: 1600px; height: 1800px; left: -800px; top: 1350px; border-radius: 50%; background: var(--accent); opacity: .08; }
.brand { position: absolute; top: 88px; left: 104px; display: flex; align-items: center; gap: 22px; }
.brand img { width: 80px; height: 80px; border-radius: 21px; }
.wordmark { font-family: 'Amatic SC', cursive; font-size: 72px; font-weight: 700; }
.category { position: absolute; top: 107px; right: 108px; font-family: 'Amatic SC', cursive; font-size: 38px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
.copy { position: absolute; top: 242px; left: 104px; right: 90px; }
h1 { margin: 0; font-size: 132px; line-height: 1.08; letter-spacing: -4px; font-weight: 800; }
h1 em { font-style: normal; color: var(--accent); }
.description { margin: 34px 0 0; font-size: 38px; line-height: 1.4; font-weight: 400; letter-spacing: -.5px; color: var(--muted); }
.device { position: absolute; top: 730px; left: 194px; width: 932px; padding: 12px; background: #222827; border: 3px solid #81908b; border-radius: 104px; box-shadow: 0 3px 0 2px #121b19, 0 28px 42px #001b2429, 0 80px 130px #001b2433; }
.device img { display: block; width: 100%; height: auto; border-radius: 88px; }
.index { position: absolute; left: 105px; bottom: 61px; font-size: 23px; letter-spacing: 3px; color: var(--muted); }
.signature { position: absolute; right: 105px; bottom: 61px; font-size: 23px; letter-spacing: 1px; color: var(--muted); }
body.ipad { width: 2064px; height: 2752px; }
.ipad .brand { left: 144px; top: 85px; }
.ipad .category { right: 144px; top: 104px; font-size: 42px; }
.ipad .copy { left: 144px; top: 220px; }
.ipad h1 { font-size: 155px; line-height: 1.02; }
.ipad .description { margin-top: 29px; font-size: 42px; }
.ipad .device { width: 1478px; left: 293px; top: 699px; padding: 17px; border-radius: 65px; }
.ipad .device img { border-radius: 45px; }
.ipad .contours { left: 700px; top: 330px; width: 2200px; height: 2800px; }
.ipad .index { left: 144px; bottom: 43px; }
.ipad .signature { right: 144px; bottom: 43px; }
</style>
</head>
<body>
<main class="canvas">
  <div class="wash"></div>
  <svg class="contours" viewBox="0 0 1200 1500" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
    <ellipse cx="650" cy="770" rx="250" ry="460"/>
    <ellipse cx="650" cy="770" rx="310" ry="520"/>
    <ellipse cx="650" cy="770" rx="370" ry="580"/>
    <ellipse cx="650" cy="770" rx="430" ry="640"/>
    <ellipse cx="650" cy="770" rx="490" ry="700"/>
    <ellipse cx="650" cy="770" rx="550" ry="760"/>
  </svg>
  <div class="brand"><img src="../../../public/icon-192.png" alt=""><span class="wordmark">Kilo</span></div>
  <div class="category" id="category"></div>
  <header class="copy"><h1 id="headline"></h1><p class="description" id="description"></p></header>
  <div class="device"><img id="screen" alt="Kilo app screenshot"></div>
  <div class="index" id="index"></div><div class="signature">Made in Hilo. For Hawaiʻi.</div>
</main>
<script>
const shots = {
  '1-now': { category: 'Your island, at a glance', title: 'Your island.<br><em>In the know.</em>', description: 'Local warnings, shelters & updates.<br>One clear view of what matters.', colors: ['#103b3c', '#fbf4e7', '#dccba7', '#cedbd3'] },
  '2-weather': { category: 'Weather', title: 'Less guesswork.<br><em>More blue sky.</em>', description: 'Your local forecast, surf & conditions.<br>In words that make sense.', colors: ['#e5edf0', '#233f4a', '#477488', '#536d77'] },
  '3-roads': { category: 'Roads', title: 'Know before<br><em>you go.</em>', description: 'Road closures & local disruptions.<br>See what’s ahead on your island.', colors: ['#f2e9d9', '#403f30', '#81724a', '#716b59'] },
  '4-tsunami': { category: 'Tsunami', title: 'Your zone.<br><em>Your next step.</em>', description: 'Check evacuation zones.<br>Know what to do before the siren.', colors: ['#dce9e3', '#214743', '#44766b', '#57726a'] },
  '5-storms': { category: 'Storms', title: 'Follow the storm.<br><em>Stay a step ahead.</em>', description: 'The forecast track & what it means<br>for your island, in plain words.', colors: ['#263e49', '#fbf4e7', '#c7d5df', '#d0dadd'] },
};
const q = new URLSearchParams(location.search);
const device = q.get('d') || 'iphone';
const name = q.get('n') || '1-now';
if (!['iphone', 'ipad'].includes(device) || !Object.hasOwn(shots, name)) throw new Error('Unknown screenshot');
const shot = shots[name];
document.body.className = device;
['paper', 'ink', 'accent', 'muted'].forEach((key, i) => document.body.style.setProperty('--' + key, shot.colors[i]));
document.getElementById('category').textContent = shot.category;
document.getElementById('headline').innerHTML = shot.title;
document.getElementById('description').innerHTML = shot.description;
document.getElementById('index').textContent = '0' + name[0] + ' / 05';
document.getElementById('screen').src = '../raw/' + device + '/' + name + '.png';
if (name === '5-storms') document.getElementById('headline').style.fontSize = device === 'ipad' ? '143px' : '118px';
</script>
</body>
</html>
